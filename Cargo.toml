[workspace]
members = ["examples", "incur", "incur-macros"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Incur Contributors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/gakonst/incur-rs"
repository = "https://github.com/gakonst/incur-rs"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg-macro = "warn"
missing-const-for-fn = "warn"
redundant-clone = "warn"
uninlined-format-args = "warn"
use-self = "warn"

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
rust-2018-idioms = "deny"
unsafe-code = "forbid"
unnameable-types = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive", "env", "string"] }
clap_derive = "4.6"
clap_complete = "4.6"
eyre = "0.6"
http = "1.3"
form_urlencoded = "1.2"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tiktoken-rs = "0.9.1"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
toml_edit = "0.25"
toon-format = { version = "0.5", default-features = false }
percent-encoding = "2.3"
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
